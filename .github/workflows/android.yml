name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.2.12479018"
  CMAKE_VERSION: "3.22.1"

# Actions are pinned to commit SHAs (the tag is in the comment): safer, and
# lets `act` replay the workflow locally (it can't resolve some nested tags).
jobs:
  test:
    name: Unit and instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # Only platform-tools: the action's default list still includes the
      # obsolete "tools" package, which the SDK repository no longer has.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        run: sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Hardware acceleration for the emulator on Linux runners. (Skipped when
      # replaying the workflow locally with `act`, which passes /dev/kvm in.)
      - name: Enable KVM
        if: ${{ !env.ACT }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # A phone-sized screen (the default AVD is tiny); the tests expect one.
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          # A fresh emulator's background apps may hang while it settles; their
          # "isn't responding" dialogs would take key focus from the tests.
          script: |
            adb shell settings put global hide_error_dialogs 1
            ./gradlew connectedDebugAndroidTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # Only platform-tools: the action's default list still includes the
      # obsolete "tools" package, which the SDK repository no longer has.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        run: sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Debug-signed, so it installs on any phone without extra setup.
      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tune-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Signed release for Google Play: on pushes to master, once the tests pass.
  # Needs the signing secrets (TUNE_KEYSTORE_BASE64, TUNE_KEYSTORE_PASSWORD,
  # TUNE_KEY_ALIAS, TUNE_KEY_PASSWORD); without them the job does nothing.
  # Uploading to Play also needs PLAY_SERVICE_ACCOUNT_JSON.
  release:
    name: Sign and publish
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check for secrets
        id: secrets
        env:
          KEYSTORE: ${{ secrets.TUNE_KEYSTORE_BASE64 }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "signing=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No TUNE_KEYSTORE_BASE64 secret, so no signed release was built."; fi
          if [ -n "$PLAY" ]; then echo "play=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.secrets.outputs.signing == 'true'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.secrets.outputs.signing == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: steps.secrets.outputs.signing == 'true'
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        if: steps.secrets.outputs.signing == 'true'
        run: sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.secrets.outputs.signing == 'true'

      # Play needs a higher version code for every upload; the run number grows
      # with each run (the offset leaves room for manual uploads).
      - name: Build signed bundle and APK
        if: steps.secrets.outputs.signing == 'true'
        env:
          TUNE_KEYSTORE_BASE64: ${{ secrets.TUNE_KEYSTORE_BASE64 }}
          TUNE_KEYSTORE_PASSWORD: ${{ secrets.TUNE_KEYSTORE_PASSWORD }}
          TUNE_KEY_ALIAS: ${{ secrets.TUNE_KEY_ALIAS }}
          TUNE_KEY_PASSWORD: ${{ secrets.TUNE_KEY_PASSWORD }}
        run: |
          export TUNE_KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$TUNE_KEYSTORE_BASE64" | base64 --decode > "$TUNE_KEYSTORE"
          export TUNE_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          ./gradlew bundleRelease assembleRelease
          rm "$TUNE_KEYSTORE"

      - name: Upload signed release
        if: steps.secrets.outputs.signing == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tune-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Track and status come from repository variables: PLAY_TRACK (default
      # internal) and PLAY_STATUS (default completed; "draft" until the app
      # has been reviewed once).
      - name: Publish to Google Play
        if: steps.secrets.outputs.signing == 'true' && steps.secrets.outputs.play == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tune.music
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}
