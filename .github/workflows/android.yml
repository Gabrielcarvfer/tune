name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.2.12479018"
  CMAKE_VERSION: "3.22.1"

# Actions are pinned to commit SHAs (the tag is in the comment): safer, and
# lets `act` replay the workflow locally (it can't resolve some nested tags).
jobs:
  test:
    name: Unit and instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # Only platform-tools: the action's default list still includes the
      # obsolete "tools" package, which the SDK repository no longer has.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        run: sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      # The open-source cache; the default "enhanced" one is a commercial service.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Hardware acceleration for the emulator on Linux runners. (Skipped when
      # replaying the workflow locally with `act`, which passes /dev/kvm in.)
      - name: Enable KVM
        if: ${{ !env.ACT }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # A phone-sized screen (the default AVD is tiny); the tests expect one.
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          # A fresh emulator's background apps may hang while it settles; their
          # "isn't responding" dialogs would take key focus from the tests.
          script: |
            adb shell settings put global hide_error_dialogs 1
            ./gradlew connectedDebugAndroidTest

      # (Artifact uploads are skipped under `act`: its artifact server is older
      # than this upload-artifact.)
      - name: Upload test reports
        if: failure() && !env.ACT
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # Only platform-tools: the action's default list still includes the
      # obsolete "tools" package, which the SDK repository no longer has.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        run: sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      # The open-source cache; the default "enhanced" one is a commercial service.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # Debug-signed, so it installs on any phone without extra setup.
      - name: Build APK
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk tune-debug.apk

      # A plain .apk (not zipped); the artifact is named after the file.
      - name: Upload APK
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: tune-debug.apk
          archive: false
          if-no-files-found: error

  # Signed release for Google Play: on pushes to master, once the tests pass.
  # Needs the signing secrets (TUNE_KEYSTORE_BASE64, TUNE_KEYSTORE_PASSWORD,
  # TUNE_KEY_ALIAS, TUNE_KEY_PASSWORD); without them the job does nothing.
  # Uploading to Play also needs PLAY_SERVICE_ACCOUNT_JSON.
  release:
    name: Sign and publish
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check for secrets
        id: secrets
        env:
          KEYSTORE: ${{ secrets.TUNE_KEYSTORE_BASE64 }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "signing=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No TUNE_KEYSTORE_BASE64 secret, so no signed release was built."; fi
          if [ -n "$PLAY" ]; then echo "play=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.signing == 'true'

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.secrets.outputs.signing == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.secrets.outputs.signing == 'true'
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        if: steps.secrets.outputs.signing == 'true'
        run: sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      # The open-source cache; the default "enhanced" one is a commercial service.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.secrets.outputs.signing == 'true'
        with:
          cache-provider: basic

      # Play needs a higher version code for every upload; the run number grows
      # with each run (the offset leaves room for manual uploads).
      - name: Build signed bundle and APK
        if: steps.secrets.outputs.signing == 'true'
        env:
          TUNE_KEYSTORE_BASE64: ${{ secrets.TUNE_KEYSTORE_BASE64 }}
          TUNE_KEYSTORE_PASSWORD: ${{ secrets.TUNE_KEYSTORE_PASSWORD }}
          TUNE_KEY_ALIAS: ${{ secrets.TUNE_KEY_ALIAS }}
          TUNE_KEY_PASSWORD: ${{ secrets.TUNE_KEY_PASSWORD }}
        run: |
          export TUNE_KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$TUNE_KEYSTORE_BASE64" | base64 --decode > "$TUNE_KEYSTORE"
          export TUNE_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          ./gradlew bundleRelease assembleRelease
          rm "$TUNE_KEYSTORE"
          cp app/build/outputs/apk/release/app-release.apk "tune-1.0.$TUNE_VERSION_CODE.apk"
          cp app/build/outputs/bundle/release/app-release.aab "tune-1.0.$TUNE_VERSION_CODE.aab"
          echo "RELEASE_NAME=tune-1.0.$TUNE_VERSION_CODE" >> "$GITHUB_ENV"

      # Plain files (not zipped), each its own artifact named after the file.
      - name: Upload signed APK
        if: steps.secrets.outputs.signing == 'true' && !env.ACT
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.RELEASE_NAME }}.apk
          archive: false
          if-no-files-found: error

      - name: Upload signed bundle
        if: steps.secrets.outputs.signing == 'true' && !env.ACT
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.RELEASE_NAME }}.aab
          archive: false
          if-no-files-found: error

      # Track and status come from repository variables: PLAY_TRACK (default
      # internal) and PLAY_STATUS (default completed; "draft" until the app
      # has been reviewed once).
      - name: Publish to Google Play
        if: steps.secrets.outputs.signing == 'true' && steps.secrets.outputs.play == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.music.tune
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}
